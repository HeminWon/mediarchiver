name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --extra dev --locked

      - name: Build wheel and sdist
        run: uv build --no-sources

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --extra dev --locked

      - name: Build single-file binary
        env:
          PYINSTALLER_CONFIG_DIR: build/pyinstaller-cache
        run: |
          uv run --no-sync pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name mediarchiver \
            --hidden-import zlib \
            --exclude-module multiprocessing \
            --collect-submodules mediarchiver.rename.rules \
            --distpath dist/bin \
            --workpath build/pyinstaller \
            --specpath build/pyinstaller \
            mediarchiver/__main__.py

      - name: Smoke binary
        run: |
          ./dist/bin/mediarchiver --version
          ./dist/bin/mediarchiver rename --list-rules
          ./dist/bin/mediarchiver archive --help

      - name: Package binary
        id: package
        run: |
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          asset="mediarchiver-${platform}-${arch}"
          mkdir -p dist/artifacts
          cp dist/bin/mediarchiver dist/artifacts/mediarchiver
          chmod +x dist/artifacts/mediarchiver
          tar -C dist/artifacts -czf "dist/${asset}.tar.gz" mediarchiver
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ steps.package.outputs.asset }}-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: 30

  verify-cli:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ github.sha }}
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6

      - name: Install with uv tool and verify
        run: |
          uv tool install dist/mediarchiver-*.whl
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mediarchiver --help
          mediarchiver rename --help
          mediarchiver archive --help

  create-release:
    needs: [verify-cli, build-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.sha }}"
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
